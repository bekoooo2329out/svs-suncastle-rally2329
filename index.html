
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>SVS 王城ラリー管制盤</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#0f172a;color:#e5e7eb}
button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:900px;margin:auto;padding:18px}
h1{font-size:24px;margin:0 0 6px}.sub{color:#94a3b8;font-size:13px;margin-bottom:18px}
.card{background:#182235;border:1px solid #2b3952;border-radius:14px;padding:15px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:620px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:#aebbd0;margin-bottom:5px}input,select{width:100%;background:#0f172a;border:1px solid #3a4964;color:#fff;border-radius:9px;padding:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
button{border:0;border-radius:9px;padding:10px 13px;background:#334155;color:#fff}.primary{background:#2563eb}.danger{background:#b91c1c}.ghost{background:#263247}
.small{font-size:12px;color:#94a3b8}.status{padding:9px 11px;border-radius:9px;background:#0b1220;margin-top:10px;display:none}
.status.ok{display:block;color:#86efac}.status.err{display:block;color:#fca5a5}
.rally{border:1px solid #34445f;border-radius:12px;padding:13px;margin-top:10px;background:#111a2b}
.rally.jp{border-left:5px solid #60a5fa}.rally.enemy{border-left:5px solid #f87171}
.head{display:flex;justify-content:space-between;gap:8px;align-items:center}.name{font-weight:700}.country{font-size:12px}
.phase{font-size:12px;color:#94a3b8;margin-top:6px}.timer{font-size:34px;font-weight:800;letter-spacing:1px;margin:4px 0}.impact{font-size:12px;color:#cbd5e1}
.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#334155;font-size:11px;margin-left:5px}
.last{font-size:17px;font-weight:700}.last strong{font-size:28px}
.preset-item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #29364d}.preset-item:last-child{border-bottom:0}
hr{border:0;border-top:1px solid #29364d;margin:14px 0}
.empty{text-align:center;color:#64748b;padding:20px}
.footer{font-size:11px;color:#64748b;text-align:center;padding:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>🏰 SVS 王城ラリー管制盤</h1>
<div class="sub">集結5分 → 行軍 → 着弾。複数ラリーを到着順で自動管理</div>
<div class="card" id="authCard">
  <strong>アクセス認証</strong>
  <div style="margin-top:10px">
    <label>共通パスワード</label>
    <input id="appPassword" type="password" placeholder="共通パスワード">
  </div>
  <button class="primary" id="loginBtn" style="margin-top:10px">入室</button>
  <div id="authMsg" class="status"></div>
  <hr>
  <strong>管理者認証</strong>
  <div style="margin-top:10px">
    <label>管理者パスワード</label>
    <input id="adminPassword" type="password" placeholder="管理者パスワード">
  </div>
  <button id="adminLoginBtn" style="margin-top:10px">編集権限を取得</button>
  <div id="adminMsg" class="status"></div>
</div>

<div id="appContent" style="display:none">

<div class="card">
<div class="grid">
<div><label>所属国</label><select id="country"><option value="jp">🇯🇵 自国</option><option value="enemy">🇺🇸 敵国</option></select></div>
<div><label>集結主プリセット</label><select id="preset"><option value="">手入力</option></select></div>
<div><label>集結主名</label><input id="leader" type="text" autocomplete="off" placeholder="例：ONI太郎"></div>
<div><label>行軍秒数</label><input id="march" type="number" min="0" step="1" inputmode="numeric" placeholder="例：42"></div>
</div>
<div class="row" style="margin-top:10px">
<button class="primary" id="startBtn">▶ START（今すぐ）</button>
<button id="clearDone">完了済みを削除</button>
</div>
<div id="msg" class="status"></div>
</div>

<div class="card">
<div class="last" id="last">現在の最後尾：—</div>
</div>

<div class="card">
<div class="row"><strong>集結主プリセット</strong><span class="small">日本語・英語どちらも登録可能</span></div>
<hr>
<div class="grid">
<div><label>集結主名</label><input id="newName" type="text" placeholder="例：ONI太郎 / Alice"></div>
<div><label>所属国</label><select id="newCountry"><option value="jp">🇯🇵 自国</option><option value="enemy">🇺🇸 敵国</option></select></div>
<div><label>行軍秒数</label><input id="newMarch" type="number" min="0" step="1" inputmode="numeric" placeholder="例：42"></div>
</div>
<button class="primary" id="savePreset" style="margin-top:10px">＋ プリセットを保存</button>
<div id="presetMsg" class="status"></div>
<div id="presetList"></div>
</div>

<div class="card">
<div class="row"><strong>進行中のラリー</strong><span class="small" id="count"></span></div>
<div id="rallies"></div>
</div>

</div>
<div class="footer">データはこのブラウザに保存されます。共有同期は次の段階で追加できます。</div>
</div>

<script>
const SUPABASE_URL = "https://cuozezternskskozwpsf.supabase.co";
const SUPABASE_KEY = "sb_publishable_b20lWTuJqUTPcIAVbuv9_w_DCZt8Hmv";
const FUNCTION_URL = SUPABASE_URL + "/functions/v1/hello-world";

let viewerToken = "";
let adminToken = "";
let state = { presets: [], rallies: [] };
let syncing = false;

const $ = id => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"']/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])
  );
}

function fmt(sec) {
  sec = Math.max(0, Math.ceil(sec));
  return String(Math.floor(sec / 60)).padStart(2,'0') + ":" +
    String(sec % 60).padStart(2,'0');
}

async function apiRequest(action, payload = {}) {
  const response = await fetch(FUNCTION_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY
    },
    body: JSON.stringify({ action, ...payload })
  });

const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error || data.message || "通信に失敗しました");
  }

  return data;
}

function showAuthMessage(id, message, error = false) {
  const el = $(id);
  el.textContent = message;
  el.className = "status " + (error ? "err" : "ok");
}

function setEditControls() {
  const editable = !!adminToken;

  ["country", "leader", "march", "newName", "newCountry", "newMarch",
   "startBtn", "clearDone", "savePreset"].forEach(id => {
    $(id).disabled = !editable;
  });

  renderPresets();
  render();
}

async function loadSharedData() {
  if (syncing) return;
  syncing = true;

  try {
    const data = await apiRequest("list", { token: viewerToken });

    state.rallies = (data.rallies || []).map(r => ({
      id: String(r.id),
      leader: r.leader,
      march: Number(r.march_seconds),
      country: r.country,
      start: new Date(r.start_at).getTime(),
      adjust: Number(r.adjust_seconds || 0),
      done: false
    }));

    state.presets = (data.presets || []).map(p => ({
      id: String(p.id),
      name: p.name,
      country: p.country,
      march: Number(p.march_seconds)
    }));

    renderPresets();
    render();
  } finally {
    syncing = false;
  }
}

function renderPresets() {
  const sel = $("preset");
  const old = sel.value;

  sel.innerHTML = '<option value="">手入力</option>' +
    state.presets.map(p =>
      `<option value="${esc(p.id)}">${esc(p.name)} / ${p.country==="jp"?"🇯🇵":"🇺🇸"} / ${p.march}秒</option>`
    ).join("");

if ([...sel.options].some(o => o.value === old)) sel.value = old;

  $("presetList").innerHTML = state.presets.length
    ? state.presets.map(p =>
      `<div class="preset-item"><span>${esc(p.name)} ${p.country==="jp"?"🇯🇵":"🇺🇸"} ${p.march}秒</span>
      <button class="danger" ${adminToken ? "" : "disabled"} onclick="delPreset('${esc(p.id)}')">削除</button></div>`
    ).join("")
    : '<div class="empty">まだプリセットはありません</div>';
}

$("preset").addEventListener("change", () => {
  const p = state.presets.find(x => x.id === $("preset").value);
  if (!p) return;
  $("leader").value = p.name;
  $("march").value = p.march;
  $("country").value = p.country;
});

$("loginBtn").addEventListener("click", async () => {
  const password = $("appPassword").value;

  if (!password) {
    showAuthMessage("authMsg", "共通パスワードを入力してください。", true);
    return;
  }

  try {
    const result = await apiRequest("login", { password });
    viewerToken = result.token;

    await loadSharedData();

    $("appContent").style.display = "block";
    $("appPassword").parentElement.style.display = "none";
    $("loginBtn").style.display = "none";

    showAuthMessage("authMsg", "入室しました。");
  } catch (error) {
    viewerToken = "";
    showAuthMessage("authMsg", error.message, true);
  }
});

$("adminLoginBtn").addEventListener("click", async () => {
  if (!viewerToken) {

showAuthMessage("adminMsg", "先に共通パスワードで入室してください。", true);
    return;
  }

  const password = $("adminPassword").value;

  if (!password) {
    showAuthMessage("adminMsg", "管理者パスワードを入力してください。", true);
    return;
  }

  try {
    const result = await apiRequest("admin_login", {
      token: viewerToken,
      password
    });

    adminToken = result.token;
    $("adminPassword").value = "";
    showAuthMessage("adminMsg", "編集権限を取得しました。");
    setEditControls();
  } catch (error) {
    adminToken = "";
    showAuthMessage("adminMsg", error.message, true);
  }
});

$("savePreset").addEventListener("click", async () => {
  if (!adminToken) return;

  const name = $("newName").value.trim();
  const march = Number($("newMarch").value);
  const country = $("newCountry").value;

 if (!name || !Number.isInteger(march) || march < 0) {
    showAuthMessage("presetMsg", "集結主名と行軍秒数を入力してください。", true);
    return;
  }

  try {
    await apiRequest("create_preset", {
      token: adminToken,
      data: { name, country, march_seconds: march }
    });

    $("newName").value = "";
    $("newMarch").value = "";
    await loadSharedData();
    showAuthMessage("presetMsg", "保存しました。");
  } catch (error) {
    showAuthMessage("presetMsg", error.message, true);
  }
});

async function delPreset(id) {
  if (!adminToken || !confirm("このプリセットを削除しますか？")) return;

  try {
    await apiRequest("delete_preset", { token: adminToken, id });
    await loadSharedData();
  } catch (error) {
    alert(error.message);
  }
}

$("startBtn").addEventListener("click", async () => {
  if (!adminToken) return;

  const leader = $("leader").value.trim();
  const march = Number($("march").value);
  const country = $("country").value;

if (!leader || !Number.isInteger(march) || march < 0) {
    $("msg").textContent = "集結主名と行軍秒数を入力してください";
    $("msg").className = "status err";
    return;
  }

  try {
    await apiRequest("create_rally", {
      token: adminToken,
      data: {
        leader,
        country,
        march_seconds: march,
        start_at: new Date().toISOString()
      }
    });

    $("leader").value = "";
    $("march").value = "";
    $("preset").value = "";
    await loadSharedData();

    $("msg").textContent = "ラリーを開始しました";
    $("msg").className = "status ok";
  } catch (error) {
    $("msg").textContent = error.message;
    $("msg").className = "status err";
  }
});

async function adjust(id, n) {
  if (!adminToken) return;

  const r = state.rallies.find(x => x.id === id);
  if (!r) return;

  try {
    await apiRequest("adjust_rally", {
      token: adminToken,
      id,
      adjust_seconds: r.adjust + n
    });
    await loadSharedData();
  } catch (error) {
    alert(error.message);
  }
}

async function cancelRally(id) {
  if (!adminToken || !confirm("このラリーを取り消しますか？")) return;

  try {
    await apiRequest("delete_rally", { token: adminToken, id });
    await loadSharedData();
  } catch (error) {
    alert(error.message);
  }
}

$("clearDone").addEventListener("click", async () => {
  if (!adminToken) return;

  const now = Date.now();
  const ids = state.rallies
    .filter(r => now >= r.start + 300000 + r.march * 1000 + r.adjust * 1000)
    .map(r => r.id);

  if (!ids.length) {
    alert("完了済みのラリーはありません。");
    return;
  }

  if (!confirm("完了済みのラリーを削除しますか？")) return;

  try {
    await apiRequest("delete_completed", { token: adminToken, ids });
    await loadSharedData();
  } catch (error) {
    alert(error.message);
  }
});

function render() {
  const now = Date.now();

state.rallies.sort((a, b) =>
    (a.start + 300000 + a.march * 1000 + a.adjust * 1000) -
    (b.start + 300000 + b.march * 1000 + b.adjust * 1000)
  );

  $("count").textContent = state.rallies.length + "件";

  const active = state.rallies.filter(r =>
    now < r.start + 300000 + r.march * 1000 + r.adjust * 1000
  );

  const last = active[active.length - 1];

  $("last").innerHTML = last
    ? `現在の最後尾：${last.country==="jp"?"🇯🇵":"🇺🇸"} ${esc(last.leader)}
       <strong>${fmt((last.start+300000+last.march*1000+last.adjust*1000-now)/1000)}</strong>`
    : "現在の最後尾：—";

 $("rallies").innerHTML = state.rallies.length
    ? state.rallies.map(r => {
      const gatherEnd = r.start + 300000 + r.adjust * 1000;
      const impact = gatherEnd + r.march * 1000;
      const remain = (impact - now) / 1000;
      const gatherRemain = (gatherEnd - now) / 1000;
      const phase = remain <= 0 ? "完了" : gatherRemain > 0 ? "集結中" : "行軍中";

return `<div class="rally ${r.country}">
        <div class="head">
          <div class="name">${r.country==="jp"?"🇯🇵":"🇺🇸"} ${esc(r.leader)}
          <span class="badge">${phase}</span></div>
          <button class="danger" ${adminToken ? "" : "disabled"} onclick="cancelRally('${esc(r.id)}')">取消</button>
        </div>
        <div class="timer">${remain<=0?"00:00":fmt(remain)}</div>
        <div class="phase">${phase==="集結中"?"集結終了まで "+fmt(gatherRemain):phase==="行軍中"?"着弾まで "+fmt(remain):"着弾済み"}</div>
        <div class="impact">着弾予定：${new Date(impact).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}</div>
        <div class="row" style="margin-top:8px">
          <button ${adminToken ? "" : "disabled"} onclick="adjust('${esc(r.id)}',-15)">−15秒</button>
          <button ${adminToken ? "" : "disabled"} onclick="adjust('${esc(r.id)}',-10)">−10秒</button>
          <button ${adminToken ? "" : "disabled"} onclick="adjust('${esc(r.id)}',-5)">−5秒</button>
          <button ${adminToken ? "" : "disabled"} onclick="adjust('${esc(r.id)}',5)">＋5秒</button>
          <button ${adminToken ? "" : "disabled"} onclick="adjust('${esc(r.id)}',10)">＋10秒</button>
          <button ${adminToken ? "" : "disabled"} onclick="adjust('${esc(r.id)}',15)">＋15秒</button>
        </div>
      </div>`;
    }).join("")
    : '<div class="empty">進行中のラリーはありません</div>';
}

setEditControls();
setInterval(() => {
  if (viewerToken && !syncing) {
    loadSharedData().catch(error => console.error(error));
  }
}, 5000);

setInterval(render, 250);
</script>
</body>
</html>
