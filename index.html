<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>SVS 王城ラリー管制盤</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#0f172a;color:#e5e7eb}
button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:900px;margin:auto;padding:18px}
h1{font-size:24px;margin:0 0 6px}.sub{color:#94a3b8;font-size:13px;margin-bottom:18px}
.card{background:#182235;border:1px solid #2b3952;border-radius:14px;padding:15px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:620px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:#aebbd0;margin-bottom:5px}input,select{width:100%;background:#0f172a;border:1px solid #3a4964;color:#fff;border-radius:9px;padding:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
button{border:0;border-radius:9px;padding:10px 13px;background:#334155;color:#fff}.primary{background:#2563eb}.danger{background:#b91c1c}.ghost{background:#263247}
.small{font-size:12px;color:#94a3b8}.status{padding:9px 11px;border-radius:9px;background:#0b1220;margin-top:10px;display:none}
.status.ok{display:block;color:#86efac}.status.err{display:block;color:#fca5a5}
.rally{border:1px solid #34445f;border-radius:12px;padding:13px;margin-top:10px;background:#111a2b}
.rally.jp{border-left:5px solid #60a5fa}.rally.enemy{border-left:5px solid #f87171}
.head{display:flex;justify-content:space-between;gap:8px;align-items:center}.name{font-weight:700}.country{font-size:12px}
.phase{font-size:12px;color:#94a3b8;margin-top:6px}.timer{font-size:34px;font-weight:800;letter-spacing:1px;margin:4px 0}.impact{font-size:12px;color:#cbd5e1}
.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#334155;font-size:11px;margin-left:5px}
.last{font-size:17px;font-weight:700}.last strong{font-size:28px}
.preset-item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #29364d}.preset-item:last-child{border-bottom:0}
hr{border:0;border-top:1px solid #29364d;margin:14px 0}
.empty{text-align:center;color:#64748b;padding:20px}
.footer{font-size:11px;color:#64748b;text-align:center;padding:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>🏰 SVS 王城ラリー管制盤</h1>
<div class="sub">集結5分 → 行軍 → 着弾。複数ラリーを到着順で自動管理</div>

<div class="card">
<div class="grid">
<div><label>所属国</label><select id="country"><option value="jp">🇯🇵 自国</option><option value="enemy">🇺🇸 敵国</option></select></div>
<div><label>集結主プリセット</label><select id="preset"><option value="">手入力</option></select></div>
<div><label>集結主名</label><input id="leader" type="text" autocomplete="off" placeholder="例：ONI太郎"></div>
<div><label>行軍秒数</label><input id="march" type="number" min="0" step="1" inputmode="numeric" placeholder="例：42"></div>
</div>
<div class="row" style="margin-top:10px">
<button class="primary" id="startBtn">▶ START（今すぐ）</button>
<button id="clearDone">完了済みを削除</button>
</div>
<div id="msg" class="status"></div>
</div>

<div class="card"><div class="last" id="last">現在の最後尾：—</div></div>

<div class="card">
<div class="row"><strong>集結主プリセット</strong><span class="small">日本語・英語どちらも登録可能／全員で共有</span></div>
<hr>
<div class="grid">
<div><label>集結主名</label><input id="newName" type="text" placeholder="例：ONI太郎 / Alice"></div>
<div><label>所属国</label><select id="newCountry"><option value="jp">🇯🇵 自国</option><option value="enemy">🇺🇸 敵国</option></select></div>
<div><label>行軍秒数</label><input id="newMarch" type="number" min="0" step="1" inputmode="numeric" placeholder="例：42"></div>
</div>
<button class="primary" id="savePreset" style="margin-top:10px">＋ プリセットを保存</button>
<div id="presetMsg" class="status"></div>
<div id="presetList"></div>
</div>

<div class="card">
<div class="row"><strong>進行中のラリー</strong><span class="small" id="count"></span></div>
<div id="rallies"></div>
</div>
<div class="footer">ラリー情報と集結主プリセットはオンラインで共有されます。</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://cuozezternskskozwpsf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_b20lWTuJqUTPcIAVbuv9_w_DCZt8Hmv";
const { createClient } = window.supabase;
const db = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let rallies = [];
let presets = [];
let busy = false;
const $ = id => document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(sec){sec=Math.max(0,Math.ceil(sec));return String(Math.floor(sec/60)).padStart(2,'0')+":"+String(sec%60).padStart(2,'0')}
function showStatus(id,message,type="ok"){
  const el=$(id);el.textContent=message;el.className="status "+type;
}
function hideStatus(id){$(id).className="status"}
function dbError(error,id="msg"){
  console.error(error);
  showStatus(id,"データベースとの通信に失敗しました："+(error?.message||"詳細不明"),"err");
}
function fromDbRally(r){
  return {id:r.id,leader:r.leader,march:Number(r.march_seconds),country:r.country,
    start:new Date(r.start_at).getTime(),adjust:Number(r.adjust_seconds||0)};
}
async function loadAll(){
  const [r,p]=await Promise.all([
    db.from("rallies").select("*").order("start_at",{ascending:true}),
    db.from("rally_presets").select("*").order("created_at",{ascending:true})
  ]);
  if(r.error){dbError(r.error);return}
  if(p.error){dbError(p.error,"presetMsg");return}
  rallies=(r.data||[]).map(fromDbRally);
  presets=(p.data||[]).map(x=>({id:x.id,name:x.name,country:x.country,march:Number(x.march_seconds)}));
  renderPresets();render();
}
function renderPresets(){
  const sel=$("preset"),old=sel.value;
  sel.innerHTML='<option value="">手入力</option>'+presets.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} / ${p.country==="jp"?"🇯🇵":"🇺🇸"} / ${p.march}秒</option>`).join("");
  if([...sel.options].some(o=>o.value===old))sel.value=old;
  $("presetList").innerHTML=presets.length?presets.map(p=>
    `<div class="preset-item"><span>${esc(p.name)}　${p.country==="jp"?"🇯🇵":"🇺🇸"}　${p.march}秒</span><button class="danger" onclick="delPreset('${p.id}')">削除</button></div>`
  ).join(""):'<div class="empty">まだプリセットはありません</div>';
}
$("preset").addEventListener("change",()=>{
  const p=presets.find(x=>x.id===$("preset").value);if(!p)return;
  $("leader").value=p.name;$("march").value=p.march;$("country").value=p.country;
});
$("savePreset").addEventListener("click",async()=>{
  if(busy)return;
  const name=$("newName").value.trim(),march=Number($("newMarch").value),country=$("newCountry").value;
  if(!name||$("newMarch").value===""||!Number.isInteger(march)||march<0){
    showStatus("presetMsg","集結主名と0以上の整数の行軍秒数を入力してください","err");return;
  }
  busy=true;
  const {error}=await db.from("rally_presets").insert({name,country,march_seconds:march});
  busy=false;
  if(error){dbError(error,"presetMsg");return}
  $("newName").value="";$("newMarch").value="";
  showStatus("presetMsg","プリセットを共有保存しました");await loadAll();
});
async function delPreset(id){
  if(!confirm("このプリセットを削除しますか？"))return;
  const {error}=await db.from("rally_presets").delete().eq("id",id);
  if(error){dbError(error,"presetMsg");return}
  await loadAll();
}
$("startBtn").addEventListener("click",async()=>{
  if(busy)return;
  const leader=$("leader").value.trim(),march=Number($("march").value),country=$("country").value;
  if(!leader||$("march").value===""||!Number.isInteger(march)||march<0){
    showStatus("msg","集結主名と0以上の整数の行軍秒数を入力してください","err");return;
  }
  busy=true;
  const {error}=await db.from("rallies").insert({
    leader,country,march_seconds:march,start_at:new Date().toISOString(),adjust_seconds:0
  });
  busy=false;
  if(error){dbError(error);return}
  showStatus("msg","ラリーを開始しました。全員の画面に反映されます。");
  $("leader").value="";$("march").value="";$("preset").value="";
  await loadAll();
}
);
async function adjust(id,n){
  const r=rallies.find(x=>x.id===id);if(!r)return;
  const {error}=await db.from("rallies").update({adjust_seconds:r.adjust+n}).eq("id",id);
  if(error){dbError(error);return}
  await loadAll();
}
async function cancelRally(id){
  if(!confirm("このラリーを取り消しますか？"))return;
  const {error}=await db.from("rallies").delete().eq("id",id);
  if(error){dbError(error);return}
  await loadAll();
}
$("clearDone").addEventListener("click",async()=>{
  const now=Date.now();
  const ids=rallies.filter(r=>r.start+300000+r.march*1000+r.adjust*1000<=now).map(r=>r.id);
  if(!ids.length){showStatus("msg","削除できる完了済みラリーはありません","err");return}
  if(!confirm(`完了済みのラリー ${ids.length}件を全員の画面から削除しますか？`))return;
  const {error}=await db.from("rallies").delete().in("id",ids);
  if(error){dbError(error);return}
  showStatus("msg","完了済みラリーを削除しました。");await loadAll();
});
function render(){
  const now=Date.now();
  const sorted=[...rallies].sort((a,b)=>(a.start+300000+a.march*1000+a.adjust*1000)-(b.start+300000+b.march*1000+b.adjust*1000));
  const active=sorted.filter(r=>now<r.start+300000+r.march*1000+r.adjust*1000);
  $("count").textContent=sorted.length+"件";
  const last=active[active.length-1];
  $("last").innerHTML=last?`現在の最後尾：${last.country==="jp"?"🇯🇵":"🇺🇸"} ${esc(last.leader)} <strong>${fmt((last.start+300000+last.march*1000+last.adjust*1000-now)/1000)}</strong>`:"現在の最後尾：—";
  $("rallies").innerHTML=sorted.length?sorted.map(r=>{
    const gatherEnd=r.start+300000+r.adjust*1000,impact=gatherEnd+r.march*1000;
    const remain=(impact-now)/1000,gatherRemain=(gatherEnd-now)/1000;
    const phase=remain<=0?"完了":gatherRemain>0?"集結中":"行軍中";
    return `<div class="rally ${r.country}">
      <div class="head"><div class="name">${r.country==="jp"?"🇯🇵":"🇺🇸"} ${esc(r.leader)} <span class="badge">${phase}</span></div><button class="danger" onclick="cancelRally('${r.id}')">取消</button></div>
      <div class="timer">${remain<=0?"00:00":fmt(remain)}</div>
      <div class="phase">${phase==="集結中"?"集結終了まで "+fmt(gatherRemain):phase==="行軍中"?"着弾まで "+fmt(remain):"着弾済み"}</div>
      <div class="impact">着弾予定：${new Date(impact).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}</div>
      <div class="row" style="margin-top:8px"><button onclick="adjust('${r.id}',-15)">−15秒</button><button onclick="adjust('${r.id}',-10)">−10秒</button><button onclick="adjust('${r.id}',-5)">−5秒</button><button onclick="adjust('${r.id}',5)">＋5秒</button><button onclick="adjust('${r.id}',10)">＋10秒</button><button onclick="adjust('${r.id}',15)">＋15秒</button></div>
    </div>`;
  }).join(""):'<div class="empty">進行中のラリーはありません</div>';
}
window.delPreset=delPreset;window.adjust=adjust;window.cancelRally=cancelRally;

async function startApp(){
  if(!window.supabase?.createClient){
    showStatus("msg","Supabaseライブラリを読み込めませんでした。通信環境を確認して再読み込みしてください。","err");return;
  }
  await loadAll();
  db.channel("svs-rally-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"rallies"},loadAll)
    .on("postgres_changes",{event:"*",schema:"public",table:"rally_presets"},loadAll)
    .subscribe(status=>{
      if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){
        showStatus("msg","リアルタイム接続が不安定です。画面を再読み込みしてください。","err");
      }
    });
}
startApp();
setInterval(render,250);
</script>
</body>
</html>
